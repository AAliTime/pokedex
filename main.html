<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex-lite!</title>
    <link rel="shortcut icon" href="./bola.png" type="image/x-icon"> 
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="pokedexWrapper" >
        <div class="pokemonSpr"><div id="sprite"></div></div>
        <div class="pokemonName"><h1 id="name">Nombre</h1></div>
        <div class="pokemonID"><h1 id="identification">ID</h1></div>
        <div class="pokemonTypes"><h1 id="types">Tipos</h1></div>
        <div class="pokemonStats"><h1 id="stats">Estadísticas</h1></div>
        <div><p id="loading"></p></div>

        <div class="pokemonSearch">
            <input type="text" id="pokemonInput" placeholder="Search">
            <button onclick="search()">Buscar pokemon</button>
        </div>

    </div>
    <script src="./index.js"></script>

</body>
</html>
